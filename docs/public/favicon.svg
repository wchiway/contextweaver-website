<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ContextWeaver icon">
  <defs>
    <!-- Obsidian gradients -->
    <linearGradient id="obs-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>

    <linearGradient id="obs-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Obsidian crystal facets -->
  <path d="M 32 12 L 46 28 L 32 35 L 18 28 Z" fill="url(#obs-dark)" stroke="#7c3aed" stroke-width="1.2" opacity="0.9"/>
  <path d="M 18 28 L 32 35 L 27 45 L 14 38 Z" fill="url(#obs-dark)" stroke="#a78bfa" stroke-width="0.8" opacity="0.85"/>
  <path d="M 46 28 L 50 38 L 37 45 L 32 35 Z" fill="url(#obs-dark)" stroke="#a78bfa" stroke-width="0.8" opacity="0.85"/>

  <!-- Center glowing facet -->
  <path d="M 27 45 L 32 35 L 37 45 L 32 52 Z" fill="url(#obs-glow)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Weaving lines -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="32" y2="52" stroke="#a78bfa" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Connection nodes -->
  <circle cx="14" cy="38" r="2" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="50" cy="38" r="2" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="32" cy="12" r="2" fill="#a78bfa" opacity="0.9"/>

  <!-- Center glow -->
  <circle cx="32" cy="40" r="3" fill="#c4b5fd" filter="url(#glow)" opacity="0.8"/>
</svg>
