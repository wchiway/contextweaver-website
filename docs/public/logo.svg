<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">ContextWeaver logo</title>
  <desc id="desc">Obsidian crystal representing interwoven code context</desc>
  <defs>
    <!-- Obsidian gradients for depth -->
    <linearGradient id="obsidian-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="obsidian-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3250;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>

    <!-- Purple highlight for the weaving concept -->
    <linearGradient id="weave-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.3" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian crystal structure - geometric facets -->
  <!-- Top facet -->
  <path d="M 100 30 L 135 75 L 100 90 L 65 75 Z"
        fill="url(#obsidian-dark)"
        stroke="#7c3aed"
        stroke-width="1.5"
        opacity="0.95"/>

  <!-- Upper left facet -->
  <path d="M 65 75 L 100 90 L 85 120 L 50 105 Z"
        fill="url(#obsidian-mid)"
        stroke="#a78bfa"
        stroke-width="1"
        opacity="0.9"/>

  <!-- Upper right facet -->
  <path d="M 135 75 L 150 105 L 115 120 L 100 90 Z"
        fill="url(#obsidian-mid)"
        stroke="#a78bfa"
        stroke-width="1"
        opacity="0.9"/>

  <!-- Center diamond (brightest - the weaving core) -->
  <path d="M 85 120 L 100 90 L 115 120 L 100 145 Z"
        fill="url(#weave-glow)"
        stroke="#8b5cf6"
        stroke-width="2.5"
        filter="url(#glow)"/>

  <!-- Lower left facet -->
  <path d="M 50 105 L 85 120 L 100 145 L 70 160 Z"
        fill="url(#obsidian-dark)"
        stroke="#7c3aed"
        stroke-width="1.5"
        opacity="0.85"/>

  <!-- Lower right facet -->
  <path d="M 150 105 L 130 160 L 100 145 L 115 120 Z"
        fill="url(#obsidian-dark)"
        stroke="#7c3aed"
        stroke-width="1.5"
        opacity="0.85"/>

  <!-- Bottom facet -->
  <path d="M 70 160 L 100 145 L 130 160 L 100 175 Z"
        fill="url(#obsidian-mid)"
        stroke="#a78bfa"
        stroke-width="1"
        opacity="0.8"/>

  <!-- Weaving threads - context connections -->
  <line x1="40" y1="100" x2="160" y2="100"
        stroke="#8b5cf6"
        stroke-width="2.5"
        opacity="0.4"
        stroke-linecap="round"/>

  <line x1="100" y1="35" x2="100" y2="170"
        stroke="#a78bfa"
        stroke-width="2.5"
        opacity="0.4"
        stroke-linecap="round"/>

  <line x1="60" y1="60" x2="140" y2="145"
        stroke="#7c3aed"
        stroke-width="2"
        opacity="0.35"
        stroke-linecap="round"/>

  <line x1="140" y1="60" x2="60" y2="145"
        stroke="#7c3aed"
        stroke-width="2"
        opacity="0.35"
        stroke-linecap="round"/>

  <!-- Connection nodes (code chunks) -->
  <circle cx="50" cy="105" r="3.5" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="150" cy="105" r="3.5" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="100" cy="30" r="3.5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="100" cy="175" r="3.5" fill="#a78bfa" opacity="0.9"/>

  <!-- Central core glow -->
  <circle cx="100" cy="117.5" r="5" fill="#c4b5fd" filter="url(#glow)" opacity="0.8"/>
</svg>
